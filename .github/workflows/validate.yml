name: validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest PyYAML jsonschema ruff pwntools
      - run: python -m pytest tests/ -q
      - run: python scripts/verify_append_only.py
      - run: python scripts/validate_skills.py
      - run: python scripts/rebuild_indexes.py --check
      - run: python scripts/check_repository_safety.py
      - run: python scripts/audit_snippets.py
      - run: python scripts/install_tools.py all --dry-run
      - run: ruff check scripts tests --select F
